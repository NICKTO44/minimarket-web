# Construye la imagen del backend en las máquinas de GitHub (no en el Droplet)
# y la publica en ghcr.io/nickto44/minimarket-backend.
#
# Se dispara al crear un tag de versión:
#   git tag v1.0.0 && git push origin v1.0.0
# o a mano desde la pestaña Actions ("Run workflow").
# Hacer push a main NO despliega nada: tú decides cuándo sale una versión.
name: Imagen del backend

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-imagen
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nickto44/minimarket-backend
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caché de capas entre corridas: la capa de dependencias de
          # cargo-chef se reutiliza mientras no cambie Cargo.lock.
          cache-from: type=gha
          cache-to: type=gha,mode=max
